name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 18 * * *"        # 18:00 UTC = 01:00 giờ Việt Nam -> chạy regression hằng đêm
  workflow_dispatch:            # Nút "Run workflow" trên tab Actions
    inputs:
      suite:
        description: "Suite cần chạy (smoke / regression / runButtonTest / runWifiSettingPOM)"
        required: true
        default: "smoke"

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Bấm tay -> suite đã chọn | Hằng đêm -> regression | Push/PR -> smoke
      SUITE: ${{ inputs.suite || (github.event_name == 'schedule' && 'regression' || 'smoke') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium + UiAutomator2 driver
        # Ghim đúng version đang dùng trên máy local
        run: |
          npm install -g appium@2.11.5
          appium driver install uiautomator2@3.7.8
          appium -v

      - name: Download ApiDemos apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps
          gh release download --repo appium/android-apidemos --pattern "ApiDemos-debug.apk" --dir apps
          ls -lh apps

      - name: Start Appium server
        run: |
          nohup appium --log appium.log --log-timestamp > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:4723/status && break
            sleep 2
          done

      - name: Enable KVM (tăng tốc emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android emulator (suite = ${{ env.SUITE }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: mvn -B test -Denv=staging -Dsuite=${{ env.SUITE }}

      - name: Upload test results
        if: always()             # Luôn upload, kể cả khi test fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.SUITE }}-${{ github.run_number }}
          path: |
            target/surefire-reports/
            screenshots/
            appium.log
          retention-days: 14
