# ===== Môi trường DEV: chạy trên máy cá nhân =====
# Mọi giá trị đều có thể ghi đè khi chạy: mvn test -Dappium.url=... -Ddevice.name=...

# Appium server
appium.url=http://127.0.0.1:4723

# Device
device.name=emulator-5554
# device.udid=emulator-5554

# App
app.package=io.appium.android.apis
app.activity=.ApiDemos
# Đường dẫn apk (tương đối so với thư mục project). Không tìm thấy file -> dùng app đã cài sẵn
app.path=../apps/ApiDemos-debug.apk

# Timeout (giây)
timeout.new.command=120
timeout.uia2.install=120
timeout.adb.exec=60
# Thoi gian cho element xuat hien (giay)
timeout.explicit.wait=15
