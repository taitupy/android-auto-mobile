# ===== Môi trường STAGING / CI =====
# Dùng khi chạy: mvn test -Denv=staging

appium.url=http://127.0.0.1:4723
device.name=emulator-5554

app.package=io.appium.android.apis
app.activity=.ApiDemos
# Trên CI, workflow tải apk về thư mục apps/ trong project
app.path=apps/ApiDemos-debug.apk

# Emulator trên CI chậm hơn -> timeout dài hơn
timeout.new.command=180
timeout.uia2.install=240
timeout.adb.exec=120
